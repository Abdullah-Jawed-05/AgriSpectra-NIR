<!doctype html>
<html><head><meta charset="utf-8"><title>04 Race</title>
<link rel="stylesheet" href="../lib/base.css">
<style>
  .panel { position: absolute; top: 0; bottom: 0; width: 960px; }
  #L { left: 0; } #R { left: 960px; }
  #div { left: 959px; top: 140px; width: 2px; height: 800px; background: linear-gradient(transparent, rgba(255,255,255,.18), transparent); }
  .ph { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  .ph .kicker { font-size: 20px; }
  .ph .h2 { margin-top: 12px; font-size: 58px; }
  .cal { position: absolute; left: 150px; top: 330px; width: 250px; height: 280px; border-radius: 26px; background: #f5f5f7; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .cal .strip { height: 64px; background: #e5483e; color: #fff; font-weight: 700; font-size: 24px; letter-spacing: .2em; display: grid; place-items: center; }
  .cal .win { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .cal .days { position: absolute; left: 0; right: 0; }
  .cal .day { height: 216px; display: grid; place-items: center; text-align: center; color: #171e1b; }
  .cal .day b { display: block; font-size: 120px; font-weight: 750; letter-spacing: -0.05em; line-height: 1; }
  .cal .day span { font-size: 22px; color: #6b7570; font-weight: 600; }
  .stat { position: absolute; text-align: left; }
  .stat .lab { font-size: 20px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .stat .val { white-space: nowrap; font-size: 92px; font-weight: 760; letter-spacing: -0.045em; line-height: 1.02; margin-top: 6px; }
  #route { left: 110px; top: 720px; width: 740px; height: 120px; }
  .status { position: absolute; left: 0; right: 0; top: 900px; text-align: center; font-size: 30px; font-weight: 600; }
  #watch { left: 150px; top: 320px; width: 300px; height: 300px; }
  #check { left: 238px; top: 408px; width: 124px; height: 124px; }
  #glowR { left: 0px; top: 0; width: 960px; height: 1080px; background: radial-gradient(600px 500px at 50% 50%, rgba(60,207,134,.16), transparent 70%); }
</style></head>
<body><div class="stage"></div>
<div id="div" class="abs"></div>

<div class="panel" id="L">
  <div class="ph" id="Lh"><div class="kicker">Lab spectroscopy</div><div class="h2">Days. And a bill.</div></div>
  <div class="cal" id="cal"><div class="strip">OCT</div><div class="win"><div class="days" id="days">
    <div class="day"><div><b>2</b><span>Day 1</span></div></div>
    <div class="day"><div><b>3</b><span>Day 2</span></div></div>
    <div class="day"><div><b>4</b><span>Day 3</span></div></div>
    <div class="day"><div><b>5</b><span>Day 4</span></div></div>
  </div></div></div>
  <div class="stat" id="Lcost" style="left:450px;top:350px"><div class="lab">Cost per test</div><div class="val" id="lc" style="font-size:80px">Rs 0</div><div class="small" style="margin-top:10px;font-size:22px">up to five figures</div></div>
  <svg id="route" class="abs" viewBox="0 0 740 120">
    <path id="rpath" d="M40,70 C220,10 480,120 700,60" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g transform="translate(40,70)"><circle r="16" fill="#3a4440"/><text y="48" text-anchor="middle" font-family="Inter" font-size="18" fill="#8d9591" font-weight="600">Sample</text></g>
    <g transform="translate(700,60)"><circle r="16" fill="#3a4440"/><path d="M-5,-9 h10 M-3,-9 v7 l-7,12 h20 l-7,-12 v-7" stroke="#cfd6d2" stroke-width="2.4" fill="none" stroke-linejoin="round"/><text y="48" text-anchor="middle" font-family="Inter" font-size="18" fill="#8d9591" font-weight="600">Lab</text></g>
    <g id="van"><g transform="translate(-26,-30)">
      <rect x="0" y="6" width="34" height="22" rx="3" fill="#e9eceb"/><path d="M34,12 h10 l8,8 v8 h-18z" fill="#cfd6d2"/>
      <circle cx="10" cy="30" r="5" fill="#222" stroke="#e9eceb" stroke-width="2"/><circle cx="42" cy="30" r="5" fill="#222" stroke="#e9eceb" stroke-width="2"/>
    </g></g>
  </svg>
  <div class="status" id="Ls" style="color:var(--muted)">Waiting for results…</div>
</div>

<div class="panel" id="R">
  <div id="glowR" class="abs" style="opacity:0"></div>
  <div class="ph" id="Rh"><div class="kicker" style="color:var(--green)">AgriSpectra</div><div class="h2">Seconds. For free.</div></div>
  <svg id="watch" class="abs" viewBox="0 0 300 300">
    <circle cx="150" cy="150" r="128" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="16"/>
    <circle id="arc" cx="150" cy="150" r="128" fill="none" stroke="#3ccf86" stroke-width="16" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="804.2" stroke-dashoffset="804.2"/>
    <rect x="135" y="-4" width="30" height="16" rx="5" fill="#cfd6d2"/>
    <text id="secs" x="150" y="172" text-anchor="middle" font-family="Inter" font-weight="760" font-size="76" fill="#fff" letter-spacing="-3">0s</text>
  </svg>
  <svg id="check" class="abs" viewBox="0 0 124 124" style="opacity:0"><circle cx="62" cy="62" r="62" fill="#3ccf86"/><path id="ck" d="M34,64 l18,18 l38,-40" stroke="#06331d" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90"/></svg>
  <div class="stat" id="Rcost" style="left:500px;top:350px"><div class="lab">Cost per scan</div><div class="val grad-green" id="rc">Rs 0</div><div class="small" style="margin-top:10px;font-size:22px">with your phone</div></div>
  <div class="status" id="Rs" style="top:760px;font-size:44px;font-weight:650;letter-spacing:-0.02em">Answer at the counter.<br><span class="grad-green">Before you pay.</span></div>
</div>

<script type="module">
import { $, css, tw, env, reveal, ease, prog, clamp, fmt, register } from '../lib/core.js';
const path = $('#rpath'); const L = path.getTotalLength();
function render(t) {
  reveal('#Lh', t, 0.3); reveal('#Rh', t, 0.6);
  // LEFT: days flip 1.6 → 6.4
  css('#cal', { opacity: tw(t, 0.8, .6), transform: `translateY(${(1 - tw(t, 0.8, .8, ease.out5)) * 40}px)` });
  const flips = [3.4, 4.8, 6.0];
  let y = 0; flips.forEach(f => y += tw(t, f, .55, ease.inOut));
  css('#days', { transform: `translateY(${-216 * y}px)` });
  reveal('#Lcost', t, 1.6);
  $('#lc').textContent = 'Rs ' + (t > 6.2 ? '10,000+' : fmt(Math.round(10000 * tw(t, 1.8, 4.4, ease.inOut) / 50) * 50));
  css('#route', { opacity: tw(t, 1.4, .6) });
  const vp = tw(t, 1.8, 4.6, ease.inOut);
  const pt = path.getPointAtLength(vp * L);
  $('#van').setAttribute('transform', `translate(${pt.x},${pt.y})`);
  css('#Ls', { opacity: tw(t, 2.2, .6) * (0.55 + 0.45 * Math.abs(Math.sin(t * 2))) });

  // RIGHT: stopwatch runs 1.6 → 3.4 (displays 0 → 10 s), finishes while the lab is still on Day 1
  css('#watch', { opacity: tw(t, 0.9, .6) * (1 - tw(t, 3.6, .4)), transform: `scale(${1 - .1 * tw(t, 3.6, .4)})` });
  const wp = tw(t, 1.6, 1.8, ease.inOut);
  $('#arc').setAttribute('stroke-dashoffset', 804.2 * (1 - wp));
  $('#secs').textContent = Math.round(wp * 10) + 's';
  const cp = tw(t, 3.6, .5, ease.back);
  css('#check', { opacity: clamp(cp * 2), transform: `scale(${.6 + .4 * cp})` });
  $('#ck').setAttribute('stroke-dashoffset', 90 * (1 - tw(t, 3.8, .5)));
  css('#glowR', { opacity: tw(t, 3.6, 1) * (0.75 + 0.25 * Math.sin(t * 2)) });
  reveal('#Rs', t, 6.8);
  reveal('#Rcost', t, 10.6);

  // the lab side recedes once the comparison has landed
  css('#L', { opacity: 1 - 0.55 * tw(t, 11.6, 1.2) });
}
register(15, render);
</script></body></html>
