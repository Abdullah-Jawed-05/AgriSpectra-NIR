<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AgriSpectra Keynote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: -apple-system, 'Inter', sans-serif; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; transition: opacity .35s ease; }
  video.on { opacity: 1; }
  #hud { position: fixed; left: 16px; bottom: 14px; color: #6f7773; font-size: 13px; letter-spacing: .04em; opacity: 0; transition: opacity .3s; }
  body.hud #hud { opacity: 1; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; color: #8d9591; font-size: 18px; text-align: center; line-height: 1.7; }
  #start b { color: #f5f5f7; font-size: 26px; display: block; margin-bottom: 6px; }
</style></head>
<body>
<video id="a" playsinline preload="auto"></video>
<video id="b" playsinline preload="auto"></video>
<div id="start"><div><b>AgriSpectra · stage video</b>Press F for fullscreen, then → / Space / clicker to start cue 1.<br>← back · R replay cue · 1–7 jump · B black screen · H show cue number</div></div>
<div id="hud"></div>
<script>
const CLIPS = ['clips/01_problem.mp4', 'clips/02_scale.mp4', 'clips/03_app.mp4', 'clips/04_race.mp4', 'clips/05_inside.mp4', 'clips/06_device.mp4', 'clips/07_close.mp4'];
const vids = [document.getElementById('a'), document.getElementById('b')];
let front = 0, idx = -1, black = false;

function hud() { document.getElementById('hud').textContent = idx < 0 ? 'ready' : `cue ${idx + 1} / ${CLIPS.length}`; }
function go(i) {
  if (i < 0 || i >= CLIPS.length) return;
  document.getElementById('start').style.display = 'none';
  black = false;
  const next = vids[1 - front], cur = vids[front];
  next.src = CLIPS[i];
  next.currentTime = 0;
  next.play().then(() => {
    next.classList.add('on'); cur.classList.remove('on');
    setTimeout(() => { cur.pause(); }, 400);
    front = 1 - front; idx = i; hud();
    // warm the cache for the following clip
    if (i + 1 < CLIPS.length) fetch(CLIPS[i + 1]).catch(() => {});
  });
}
// a finished clip simply stays on its last frame (no loop), which is the hold
vids.forEach(v => { v.loop = false; v.muted = true; });

document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); go(idx + 1); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(k)) { e.preventDefault(); go(Math.max(0, idx - 1)); }
  else if (k === 'r' || k === 'R') go(Math.max(0, idx));
  else if (k >= '1' && k <= '9') go(+k - 1);
  else if (k === 'f' || k === 'F') document.documentElement.requestFullscreen?.();
  else if (k === 'h' || k === 'H') document.body.classList.toggle('hud');
  else if (k === 'b' || k === 'B') { black = !black; vids[front].classList.toggle('on', !black); }
});
document.addEventListener('click', () => go(idx + 1));
hud();
</script>
</body></html>
