org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The pub cache (plugin Kotlin sources) lives on C: while this project is on
# E:. Kotlin's incremental compiler tries to relativize the plugin source
# path against the on-E: build dir and throws "this and base files have
# different roots", failing :share_plus:compileDebugKotlin. Turning off
# incremental Kotlin compilation sidesteps the cross-drive path math.
kotlin.incremental=false
